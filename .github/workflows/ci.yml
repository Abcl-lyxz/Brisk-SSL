name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-archs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build brisk-dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: brisk-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test on every arch (x86_64, asan, 9 cross archs under qemu)
        run: python3 tools/dev.py test --arch all -j 4
      - name: Size report
        run: |
          python3 tools/dev.py size --arch all --md > size.md
          cat size.md >> "$GITHUB_STEP_SUMMARY"
          cat size.md
